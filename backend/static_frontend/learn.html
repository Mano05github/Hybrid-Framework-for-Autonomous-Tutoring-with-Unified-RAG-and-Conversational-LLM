<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn | Vaathiyar AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/landing.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">

    <!-- Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- API & Auth -->
    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/auth-guard.js"></script>
    <script>
        (async () => {
            const ok = await AuthGuard.checkAuth();
            if (!ok) window.location.href = 'login.html';
        })();
    </script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        {% verbatim %}
        const { useState, useEffect, useRef } = React;

        /* ─────────────────────────────────────────────
           Subject icon map — Lucide icon name by keyword
        ───────────────────────────────────────────── */
        const SUBJECT_ICONS = [
            { keywords: ['math', 'maths', 'calculus', 'algebra'],  icon: 'calculator' },
            { keywords: ['physics', 'quantum', 'mechanics'],        icon: 'atom' },
            { keywords: ['chemistry', 'chem'],                      icon: 'flask-conical' },
            { keywords: ['ai', 'ml', 'machine', 'neural', 'deep'],  icon: 'brain' },
            { keywords: ['english', 'language', 'writing', 'lit'],  icon: 'book-open' },
            { keywords: ['biology', 'bio'],                          icon: 'dna' },
            { keywords: ['computer', 'cs', 'programming', 'code'],  icon: 'code-2' },
            { keywords: ['history'],                                 icon: 'scroll' },
            { keywords: ['geography', 'geo'],                        icon: 'globe' },
        ];

        const getSubjectIcon = (name) => {
            const lower = (name || '').toLowerCase();
            for (const entry of SUBJECT_ICONS) {
                if (entry.keywords.some(k => lower.includes(k))) return entry.icon;
            }
            return 'layers';
        };

        const eloToMastery = (elo) =>
            Math.round(Math.min(100, Math.max(0, (elo / 2000) * 100)));

        /* ─────────────────────────────────────────────
           Sidebar  (Learn = active, Dashboard = link)
        ───────────────────────────────────────────── */
        const Sidebar = ({ user, onLogout }) => {
            useEffect(() => { lucide.createIcons(); });

            const navItems = [
                { icon: 'layout-dashboard', label: 'Dashboard', href: 'dashboard.html', active: false },
                { icon: 'book-open',        label: 'Learn',     href: '#',              active: true  },
            ];

            return (
                <aside className="db-sidebar">
                    <div className="db-sidebar-brand">
                        <div className="db-brand-icon">🤖</div>
                        <span className="db-brand-name">VAATHIYAR</span>
                    </div>

                    <nav className="db-nav">
                        {navItems.map((item, i) => (
                            <a key={i} href={item.href}
                               className={`db-nav-item${item.active ? ' active' : ''}`}>
                                <i data-lucide={item.icon} className="db-nav-icon"></i>
                                <span>{item.label}</span>
                            </a>
                        ))}
                    </nav>

                    <div className="db-sidebar-footer">
                        <div className="db-user-row">
                            <div className="db-avatar">
                                {user?.username?.charAt(0).toUpperCase() || 'U'}
                            </div>
                            <div>
                                <div className="db-user-name">{user?.username || 'User'}</div>
                                <div className="db-user-role">Student</div>
                            </div>
                        </div>
                        <button className="db-logout-btn" onClick={onLogout}>
                            <i data-lucide="log-out" style={{ width: 14, height: 14 }}></i>
                            <span>Logout</span>
                        </button>
                    </div>
                </aside>
            );
        };

        /* ─────────────────────────────────────────────
           Header  (title + subtitle + global progress bar)
        ───────────────────────────────────────────── */
        const LearnHeader = ({ globalPct }) => (
            <div className="lp-header">
                <h1 className="lp-title">Learn</h1>
                <p className="lp-subtitle">"Choose a subject to continue your learning journey"</p>

                <div className="lp-global-bar-row">
                    <span className="lp-global-bar-label">Global progress completion</span>
                    <span className="lp-global-bar-pct">{globalPct}%</span>
                </div>
                <div className="lp-global-bar-track">
                    <div className="lp-global-bar-fill" style={{ width: `${globalPct}%` }}></div>
                </div>

                <hr className="lp-divider" />
            </div>
        );

        /* ─────────────────────────────────────────────
           Resume Card
        ───────────────────────────────────────────── */
        const ResumeCard = ({ lastSession }) => {
            useEffect(() => { lucide.createIcons(); });

            if (!lastSession) {
                return (
                    <div className="lp-resume-card" style={{ justifyContent: 'center' }}>
                        <p style={{ color: 'var(--db-muted)', margin: 0, fontSize: '0.9rem' }}>
                            No recent sessions yet — start your first session!
                        </p>
                        <a href="canvas.html" className="lp-resume-btn" style={{ marginLeft: '1.5rem', flexShrink: 0 }}>
                            Start Learning
                        </a>
                    </div>
                );
            }

            const topicName = lastSession.topic || 'General Learning';
            const href = lastSession.topicId
                ? `canvas.html?topic_id=${lastSession.topicId}`
                : 'canvas.html';

            return (
                <div className="lp-resume-card">
                    <div className="lp-resume-icon-box">
                        <i data-lucide="user-circle" style={{ width: 24, height: 24 }}></i>
                    </div>
                    <div className="lp-resume-info">
                        <p className="lp-resume-meta">Last studied</p>
                        <p className="lp-resume-topic">{topicName}</p>
                    </div>
                    <div className="lp-resume-right">
                        <a href={href} className="lp-resume-btn">Continue Learning</a>
                    </div>
                </div>
            );
        };

        /* ─────────────────────────────────────────────
           Subject Card
        ───────────────────────────────────────────── */
        const SubjectCard = ({ subject }) => {
            const iconName  = getSubjectIcon(subject.name);
            const pct       = subject.mastery_pct || 0;
            const completed = subject.completed_topic_count || 0;
            const total     = subject.topic_count || 0;

            useEffect(() => { lucide.createIcons(); });

            return (
                <div className="lp-subject-card">
                    <div className="lp-card-top">
                        <div className="lp-subject-icon-box">
                            <i data-lucide={iconName} style={{ width: 20, height: 20 }}></i>
                        </div>
                        {subject.has_recommended && (
                            <span style={{
                                fontSize: '0.65rem', fontWeight: 600,
                                background: 'rgba(99,179,237,0.15)', color: 'var(--db-blue)',
                                border: '1px solid rgba(99,179,237,0.3)',
                                padding: '0.15rem 0.5rem', borderRadius: '99px',
                                marginLeft: 'auto',
                            }}>Recommended</span>
                        )}
                    </div>

                    <div className="lp-card-name-row">
                        <span className="lp-card-name">{subject.name}</span>
                        <span className="lp-card-pct">{pct}%</span>
                    </div>

                    <div className="lp-card-bar-track">
                        <div className="lp-card-bar-fill" style={{ width: `${pct}%` }}></div>
                    </div>

                    <div className="lp-card-topics">{completed} / {total} Topics</div>

                    <a
                        href={`subject-hub.html?subject_id=${subject.id}`}
                        className="lp-explore-btn"
                    >
                        Explore
                    </a>
                </div>
            );
        };

        /* ─────────────────────────────────────────────
           Core Modules Grid
        ───────────────────────────────────────────── */
        const CoreModulesGrid = ({ subjects }) => (
            <div>
                <div className="lp-section-title">Core Modules Grid</div>
                <div className="lp-modules-grid">
                    {subjects.length === 0 ? (
                        <div className="lp-empty">
                            No subjects found. Ask your instructor to add content.
                        </div>
                    ) : (
                        subjects.map((s, i) => <SubjectCard key={i} subject={s} />)
                    )}
                </div>
            </div>
        );

        /* ─────────────────────────────────────────────
           Main Learn Page
        ───────────────────────────────────────────── */
        const LearnPage = () => {
            const [user,        setUser]        = useState(null);
            const [globalPct,   setGlobalPct]   = useState(0);
            const [lastSession, setLastSession] = useState(null);
            const [subjects,    setSubjects]    = useState([]);

            const handleLogout = async () => {
                try { await fetch('/api/users/logout/', { method: 'POST', credentials: 'include' }); } catch(e) {}
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            };

            useEffect(() => {
                let mounted = true;

                const load = async () => {
                    const u = AuthGuard.getUser();
                    if (mounted) setUser(u);

                    const [statsRes, recentRes] = await Promise.allSettled([
                        fetch('/api/core/subjects/learn-stats/', { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                        fetch('/api/sessions/recent/?limit=1',  { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                    ]);

                    if (!mounted) return;

                    /* ── Subject stats (server-computed) ── */
                    const statsData = statsRes.status === 'fulfilled' ? statsRes.value : null;
                    if (statsData) {
                        setGlobalPct(statsData.global_pct || 0);
                        setSubjects(statsData.subjects || []);
                    }

                    /* ── Recent session for resume card ── */
                    const recentData = recentRes.status === 'fulfilled' ? recentRes.value : null;
                    const sessions   = recentData?.sessions || [];
                    setLastSession(sessions.length > 0 ? sessions[0] : null);
                };

                load();
                return () => { mounted = false; };
            }, []);

            useEffect(() => { lucide.createIcons(); });

            return (
                <div className="db-layout">
                    <Sidebar user={user} onLogout={handleLogout} />

                    <main className="db-main">
                        <LearnHeader globalPct={globalPct} />
                        <ResumeCard lastSession={lastSession} />
                        <CoreModulesGrid subjects={subjects} />
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<LearnPage />);
        {% endverbatim %}
    </script>
</body>
</html>
