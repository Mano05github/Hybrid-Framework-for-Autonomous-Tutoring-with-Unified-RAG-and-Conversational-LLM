<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaathiyar AI - Pedagogical Operating System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/landing.css">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- GSAP for Cinematics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Three.js for 3D Hero -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <div id="root"></div>

    <script type="text/babel">
        {% verbatim %}
        const { useState, useEffect, useRef } = React;

        // --- Utils: Mouse tracking for cursor ---
        const useMousePosition = () => {
            const [mousePosition, setMousePosition] = useState({ x: 0, y: 0 });
            useEffect(() => {
                const updateMousePosition = ev => {
                    setMousePosition({ x: ev.clientX, y: ev.clientY });
                    
                    // Direct DOM manipulation for performance
                    const dot = document.querySelector('.cursor-dot');
                    const outline = document.querySelector('.cursor-outline');
                    if(dot && outline) {
                        dot.style.left = `${ev.clientX}px`;
                        dot.style.top = `${ev.clientY}px`;
                        
                        // Delayed follow for cinematic feel
                        outline.animate({
                            left: `${ev.clientX}px`,
                            top: `${ev.clientY}px`
                        }, { duration: 500, fill: "forwards" });
                    }
                };
                window.addEventListener('mousemove', updateMousePosition);
                return () => window.removeEventListener('mousemove', updateMousePosition);
            }, []);
            return mousePosition;
        };

        // --- Component: Hero 3D Orb (Replaces OrbVisualizer) ---
        const HeroOrb = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                // Scene Setup
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                
                renderer.setSize(window.innerWidth, window.innerHeight);
                mountRef.current.appendChild(renderer.domElement);

                // Orb Geometry (Icosahedron for "Tech" look)
                const geometry = new THREE.IcosahedronGeometry(1.5, 1);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00f2ff, 
                    wireframe: true,
                    transparent: true,
                    opacity: 0.3
                });
                const orb = new THREE.Mesh(geometry, material);
                scene.add(orb);

                // Solid Core
                const coreGeo = new THREE.SphereGeometry(0.8, 32, 32);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const core = new THREE.Mesh(coreGeo, coreMat);
                scene.add(core);
                
                // Outer Ring
                const ringGeo = new THREE.TorusGeometry(3, 0.05, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.5 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                scene.add(ring);

                camera.position.z = 5;

                // Animation
                const animate = () => {
                    requestAnimationFrame(animate);
                    orb.rotation.x += 0.002;
                    orb.rotation.y += 0.005;
                    
                    ring.rotation.z -= 0.01;
                    ring.rotation.x = Math.PI / 2 + Math.sin(Date.now() * 0.001) * 0.2;

                    renderer.render(scene, camera);
                };
                animate();

                // Responsive
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    mountRef.current?.removeChild(renderer.domElement);
                };
            }, []);

            return <div id="canvas-container" ref={mountRef} style={{position:'absolute', top:0, left:0, zIndex: 1}} />;
        };

        // --- Component: HUD Stats ---
        const HUD = () => (
            <>
                <div className="hud-element hud-left">
                    <span className="hud-label">Latency</span>
                    <span className="hud-value">12ms</span>
                </div>
                <div className="hud-element hud-right">
                    <span className="hud-label">Active Agents</span>
                    <span className="hud-value">04</span>
                </div>
                <div className="hud-element hud-bottom">
                    <span className="hud-label">System State</span>
                    <span className="hud-value">ONLINE // ORCHESTRATING</span>
                </div>
            </>
        );

        // --- Component: Cinematic Hero Section ---
        const HeroSection = () => {
             useEffect(() => {
                 const tl = gsap.timeline();
                 tl.to(".hero-title", { duration: 1.5, y: 0, opacity: 1, ease: "power4.out", delay: 0.5 })
                   .to(".hud-element", { duration: 1, opacity: 1, stagger: 0.2 }, "-=1");
                 
                 // Parallax Effect
                 gsap.to(".hero-bg-text", {
                     scrollTrigger: {
                        trigger: ".hero-section",
                        start: "top top",
                        end: "bottom top",
                        scrub: true
                     },
                     y: 200,
                     scale: 1.2
                 });
             }, []);

             return (
                <section className="hero-section">
                    <div className="hero-bg-text">INTELLIGENCE</div>
                    <HeroOrb />
                    <HUD />
                    <div className="hero-content">
                        <h1 className="hero-title">Pedagogical OS</h1>
                    </div>
                </section>
             );
        };

        // --- Component: Horizontal Scroll Carousel ---
        const AgentsCarousel = () => {
            const sectionRef = useRef(null);
            const containerRef = useRef(null);

            useEffect(() => {
                if (!sectionRef.current || !containerRef.current) return;

                const scrollWidth = containerRef.current.scrollWidth;
                const windowWidth = window.innerWidth;

                gsap.to(containerRef.current, {
                    x: () => -(scrollWidth - windowWidth),
                    ease: "none",
                    scrollTrigger: {
                        trigger: sectionRef.current,
                        pin: true,
                        scrub: 1,
                        start: "top top",
                        end: () => `+=${scrollWidth}`,
                        invalidateOnRefresh: true,
                    }
                });
            }, []);

            const agents = [
                { title: "The Supervisor", role: "Orchestrator", color: "#00f2ff" },
                { title: "Socratic Mind", role: "Examiner", color: "#ff0055" },
                { title: "Empath Core", role: "Affective", color: "#7000ff" },
                { title: "Code Runner", role: "Sandbox", color: "#00ff9d" },
                // Duplicate for scroll length
                { title: "Vector DB", role: "Knowledge", color: "#ffffff" }, 
            ];

            return (
                <section ref={sectionRef} className="cinematic-section" style={{overflow: 'hidden', height: '100vh', justifyContent: 'center'}}>
                     <h2 className="section-title" style={{top: '20%', fontSize: '4rem', opacity: 1, color: '#fff', textShadow: '0 0 20px rgba(255,255,255,0.2)'}}>
                        AGENT FLEET
                     </h2>
                     <div ref={containerRef} className="carousel-container">
                        {agents.map((agent, i) => (
                            <div key={i} className="cinematic-card">
                                <div className="card-image">
                                    {/* Abstract visual */}
                                    <div style={{
                                        width: '100px', height: '100px', 
                                        border: `2px solid ${agent.color}`, 
                                        borderRadius: '50%',
                                        boxShadow: `0 0 20px ${agent.color}`,
                                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                                        color: agent.color, fontFamily: 'monospace'
                                    }}>AI-{i+1}</div>
                                </div>
                                <div className="card-info">
                                    <span className="card-meta" style={{color: agent.color}}>{agent.role}</span>
                                    <h3 className="card-title">{agent.title}</h3>
                                    <p style={{color: '#666', fontSize: '0.9rem'}}>Real-time adaptive logic module.</p>
                                </div>
                            </div>
                        ))}
                     </div>
                </section>
            );
        };

        // --- Component: Feature List (Poster Style) ---
        const FeatureList = () => {
             useEffect(() => {
                 gsap.utils.toArray('.feature-row').forEach(row => {
                     gsap.from(row, {
                         opacity: 0,
                         y: 50,
                         duration: 1,
                         scrollTrigger: { trigger: row, start: "top 80%" }
                     });
                 });
             }, []);

             return (
                 <section className="cinematic-section" style={{background: '#000'}}>
                    <div style={{maxWidth: '1200px', margin: '0 auto', width: '100%'}}>
                        <div className="feature-row">
                            <span className="feature-number">01</span>
                            <div className="feature-desc">
                                <h3 className="text-hightlight" style={{marginBottom: '1rem', fontFamily: 'Space Grotesk'}}>OMNI-RAG GROUNDING</h3>
                                Full semantic vector cache with academic knowledge base verification prevents hallucinations.
                            </div>
                        </div>
                        <div className="feature-row">
                            <span className="feature-number">02</span>
                            <div className="feature-desc">
                                <h3 className="text-accent" style={{marginBottom: '1rem', fontFamily: 'Space Grotesk'}}>MULTI-MODAL FLUIDITY</h3>
                                Native voice, handwriting, and diagram inputs processed in parallel streams.
                            </div>
                        </div>
                        <div className="feature-row">
                            <span className="feature-number">03</span>
                            <div className="feature-desc">
                                <h3 className="text-hightlight" style={{marginBottom: '1rem', fontFamily: 'Space Grotesk'}}>ADAPTIVE PACING</h3>
                                Real-time student state modeling adjusts curriculum velocity instantly.
                            </div>
                        </div>
                    </div>
                 </section>
             );
        };

        const Navigation = () => (
            <nav className="landing-nav">
                <div style={{fontWeight: 700, letterSpacing: '-1px'}}>VAATHIYAR</div>
                <div className="nav-links">
                    <a href="#agents" className="nav-link">Agents</a>
                    <a href="#engine" className="nav-link">Engine</a>
                    <a href="#use-cases" className="nav-link">Use Cases</a>
                    <a href="login.html" className="btn btn-primary" style={{padding: '0.4rem 1rem', fontSize: '0.8rem', textDecoration: 'none'}}>Login</a>
                </div>
            </nav>
        );

        const App = () => {
            useMousePosition();
            
            return (
                <div className="app-container">
                    <Navigation />
                    <HeroSection />
                    <AgentsCarousel />
                    <FeatureList />
                    <footer className="credits-footer">
                        Designed for the Future of Education <br/>
                        <span style={{color: '#ff0055'}}>VAATHIYAR SYSTEMS INC.</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endverbatim %}
    </script>
</body>
</html>
