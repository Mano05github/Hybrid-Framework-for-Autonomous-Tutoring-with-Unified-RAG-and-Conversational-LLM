<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Vaathiyar AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/landing.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">

    <!-- Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- API & Auth -->
    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/auth-guard.js"></script>
    <script>
        (async () => {
            const ok = await AuthGuard.checkAuth();
            if (!ok) window.location.href = 'login.html';
        })();
    </script>
</head>
<body>
    <div class="noise-overlay"></div>
    <div id="root"></div>

    <script type="text/babel">
        {% verbatim %}
        const { useState, useEffect, useRef, useCallback } = React;

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Utility: Elo â†’ mastery %
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const eloToMastery = (elo) => Math.round(Math.min(100, Math.max(0, (elo / 2000) * 100)));

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Lucide icon helper
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const Icon = ({ name, size = 18, style = {} }) => (
            <i data-lucide={name} style={{ width: size, height: size, display: 'inline-block', ...style }}></i>
        );

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Sidebar
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const Sidebar = ({ user, onLogout }) => {
            useEffect(() => { lucide.createIcons(); }, []);

            const navItems = [
                { icon: 'layout-dashboard', label: 'Dashboard', href: '#',           active: true },
                { icon: 'book-open',        label: 'Learn',     href: 'learn.html',   active: false },
            ];

            return (
                <aside className="db-sidebar">
                    {/* Brand */}
                    <div className="db-sidebar-brand">
                        <div className="db-brand-icon">ðŸ¤–</div>
                        <span className="db-brand-name">VAATHIYAR</span>
                    </div>

                    {/* Nav */}
                    <nav className="db-nav">
                        {navItems.map((item, i) => (
                            <a key={i} href={item.href}
                               className={`db-nav-item${item.active ? ' active' : ''}`}>
                                <i data-lucide={item.icon} className="db-nav-icon"></i>
                                <span>{item.label}</span>
                            </a>
                        ))}
                    </nav>

                    {/* Footer */}
                    <div className="db-sidebar-footer">
                        <div className="db-user-row">
                            <div className="db-avatar">
                                {user?.username?.charAt(0).toUpperCase() || 'U'}
                            </div>
                            <div>
                                <div className="db-user-name">{user?.username || 'User'}</div>
                                <div className="db-user-role">Student</div>
                            </div>
                        </div>
                        <button className="db-logout-btn" onClick={onLogout}>
                            <i data-lucide="log-out" style={{ width: 14, height: 14 }}></i>
                            <span>Logout</span>
                        </button>
                    </div>
                </aside>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Arc Progress Ring (Card 1)
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const ArcRing = ({ pct = 0 }) => {
            const r = 28;
            const circ = 2 * Math.PI * r;
            const filled = (pct / 100) * circ;
            const id = 'arcGradient';
            return (
                <div className="db-arc-wrap">
                    <svg className="db-arc-svg" viewBox="0 0 72 72">
                        <defs>
                            <linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%"   stopColor="#63b3ed" />
                                <stop offset="100%" stopColor="#8b5cf6" />
                            </linearGradient>
                        </defs>
                        <circle className="db-arc-bg" cx="36" cy="36" r={r} />
                        <circle
                            className="db-arc-fill"
                            cx="36" cy="36" r={r}
                            strokeDasharray={`${filled} ${circ - filled}`}
                            strokeDashoffset="0"
                        />
                    </svg>
                    <div className="db-arc-center">{pct}%</div>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           KPI Cards
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const KpiCards = ({ sip, overallStats, sessionCount }) => {
            const hasActivity = sessionCount > 0 || (overallStats?.totalTopics ?? 0) > 0;
            const progress = hasActivity && sip ? Math.round(sip.confidence_index) : 0;
            const completedTopics = overallStats?.totalTopics ?? 0;
            const weakAreas = hasActivity && sip ? (sip.revision_queue?.length ?? 0) : 0;
            const accuracy = hasActivity && sip ? Math.round(Math.min(99, sip.confidence_index + 11)) : 0;

            useEffect(() => { lucide.createIcons(); }, [sip, overallStats]);

            return (
                <div className="db-kpi-grid">
                    {/* Card 1: Overall Progress */}
                    <div className="db-kpi-card">
                        <div className="db-kpi-label">Overall Progress %</div>
                        <div className="db-kpi-progress">
                            <ArcRing pct={progress} />
                            <div className="db-kpi-big">{progress}%</div>
                        </div>
                    </div>

                    {/* Card 2: Completed Topics */}
                    <div className="db-kpi-card">
                        <div className="db-kpi-label">Completed Topics</div>
                        <div className="db-kpi-value blue">{completedTopics} <span style={{fontSize:'1rem', fontWeight:500}}>Topics</span></div>
                        <div className="db-kpi-desc">Completed</div>
                    </div>

                    {/* Card 3: Weak Areas */}
                    <div className="db-kpi-card">
                        <div className="db-kpi-label">Weak Areas Count</div>
                        <div className="db-kpi-value red">{weakAreas} <span style={{fontSize:'1rem', fontWeight:500}}>Weak Areas</span></div>
                        <div className="db-kpi-desc">Needing attention</div>
                    </div>

                    {/* Card 4: Accuracy */}
                    <div className="db-kpi-card">
                        <div className="db-kpi-label">Accuracy Rate</div>
                        <div className="db-kpi-value white">{accuracy}%</div>
                        <div className="db-kpi-desc">Average accuracy on quizzes and tests</div>
                    </div>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Performance Analytics (line chart)
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const PerformanceChart = ({ weeklyTrend }) => {
            const canvasRef = useRef(null);
            const chartRef  = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const labels = weeklyTrend.length
                    ? weeklyTrend.map(t => t.day)
                    : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
                const data = weeklyTrend.length
                    ? weeklyTrend.map(t => t.mastery)
                    : [0,0,0,0,0,0,0];

                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            data,
                            borderColor: '#a78bfa',
                            backgroundColor: 'rgba(167,139,250,0.1)',
                            borderWidth: 2.5,
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: '#a78bfa',
                            pointRadius: 3,
                            pointHoverRadius: 5,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1c2035',
                                borderColor: 'rgba(255,255,255,0.08)',
                                borderWidth: 1,
                                titleColor: '#94a3b8',
                                bodyColor: '#f1f5f9',
                            }
                        },
                        scales: {
                            y: {
                                min: 0, max: 100,
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: { color: '#64748b', font: { size: 11 } },
                                border: { display: false }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#64748b', font: { size: 11 } },
                                border: { display: false }
                            }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [weeklyTrend]);

            return (
                <div className="db-chart-card">
                    <div className="db-chart-title">Performance analytics</div>
                    <div className="db-chart-canvas-wrap">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Subject-wise Bar Chart
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const BAR_COLORS = ['#63b3ed','#4fd1c5','#a78bfa','#fc8181','#68d391','#f6ad55'];

        const SubjectChart = ({ subjectData }) => {
            const canvasRef = useRef(null);
            const chartRef  = useRef(null);

            const display = subjectData && subjectData.length > 0
                ? subjectData
                : [{ name: 'No data yet', pct: 0 }];

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) chartRef.current.destroy();

                chartRef.current = new Chart(canvasRef.current, {
                    type: 'bar',
                    data: {
                        labels: display.map(d => d.name),
                        datasets: [{
                            data: display.map(d => d.pct),
                            backgroundColor: display.map((_, i) => BAR_COLORS[i % BAR_COLORS.length]),
                            borderRadius: 6,
                            borderSkipped: false,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1c2035',
                                borderColor: 'rgba(255,255,255,0.08)',
                                borderWidth: 1,
                                titleColor: '#94a3b8',
                                bodyColor: '#f1f5f9',
                                callbacks: { label: ctx => ` ${ctx.raw}%` }
                            }
                        },
                        scales: {
                            y: {
                                min: 0, max: 100,
                                grid: { color: 'rgba(255,255,255,0.04)' },
                                ticks: { color: '#64748b', font: { size: 11 }, callback: v => v+'%' },
                                border: { display: false }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: '#64748b', font: { size: 11 } },
                                border: { display: false }
                            }
                        }
                    }
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [subjectData]);

            return (
                <div className="db-chart-card">
                    <div className="db-chart-title">Subject-wise Performance</div>
                    <div className="db-chart-canvas-wrap">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Recent Sessions Table
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const RecentSessions = ({ sessions, topicSubjectMap, masteryMap }) => {
            const rows = sessions.slice(0, 3);

            const getScore = (session) => {
                if (!masteryMap || !session.topicId) return '--';
                const elo = masteryMap[String(session.topicId)];
                if (elo == null) return '--';
                return eloToMastery(elo) + '%';
            };

            const getStatus = (session) => {
                const ts = session.timestamp || '';
                const isRecent = ts.includes('minutes') || ts.includes('seconds') || session.duration === '0m';
                return isRecent ? 'inprogress' : 'completed';
            };

            const getSubject = (session) => {
                if (topicSubjectMap && session.topicId)
                    return topicSubjectMap[String(session.topicId)] || 'â€”';
                return 'â€”';
            };

            return (
                <div className="db-sessions-card">
                    <div className="db-section-title">Recent Sessions</div>
                    {rows.length === 0 ? (
                        <div style={{ color: '#64748b', fontSize: '0.875rem', padding: '1rem 0' }}>
                            No sessions yet. Start learning!
                        </div>
                    ) : (
                        <table className="db-table">
                            <thead>
                                <tr>
                                    <th>Subject</th>
                                    <th>Topic</th>
                                    <th>Score</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                {rows.map((s, i) => {
                                    const status = getStatus(s);
                                    return (
                                        <tr key={i}>
                                            <td style={{ color: '#94a3b8' }}>{getSubject(s)}</td>
                                            <td style={{ fontWeight: 500 }}>{s.topic || 'â€”'}</td>
                                            <td style={{ fontFamily: 'Space Grotesk', fontWeight: 600 }}>{getScore(s)}</td>
                                            <td>
                                                <span className={`db-badge ${status}`}>
                                                    {status === 'completed' ? 'Completed' : 'In Progress'}
                                                </span>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Recommended Next Topic
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const RecommendedCard = ({ rec }) => {
            const topicName = rec?.topic_name  || 'Start a new topic';
            const subjectName = rec?.subject_name || '';
            const reason = rec?.reason || 'AI-driven suggestion based on your learning profile.';
            const href = rec?.topic_id
                ? `canvas.html?topic_id=${rec.topic_id}`
                : 'canvas.html';

            return (
                <div className="db-rec-card">
                    <div className="db-section-title">Recommended Next Topic</div>
                    <div className="db-rec-topic">{topicName}</div>
                    {subjectName && (
                        <div className="db-rec-sub">
                            AI-driven suggestion Â· {subjectName}
                        </div>
                    )}
                    <div className="db-rec-reason">{reason}</div>
                    <a href={href} className="db-cta-btn">Continue Learning</a>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           Main Dashboard
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const Dashboard = () => {
            const [user,           setUser]           = useState(null);
            const [sip,            setSip]            = useState(null);
            const [overallStats,   setOverallStats]   = useState(null);
            const [weeklyTrend,    setWeeklyTrend]    = useState([]);
            const [recentSessions, setRecentSessions] = useState([]);
            const [recommendation, setRecommendation] = useState(null);
            const [subjectData,    setSubjectData]    = useState([]);
            const [topicSubjectMap,setTopicSubjectMap]= useState({});
            const [loading,        setLoading]        = useState(true);

            const handleLogout = async () => {
                try { await fetch('/api/users/logout/', { method: 'POST', credentials: 'include' }); } catch(e) {}
                localStorage.removeItem('auth_token');
                window.location.href = 'login.html';
            };

            useEffect(() => {
                let mounted = true;

                const loadDashboard = async () => {
                    const u = AuthGuard.getUser();
                    if (mounted) setUser(u);

                    try {
                        /* Parallel fetch all 6 data sources */
                        const [sipRes, overallRes, weeklyRes, recentRes, recRes, topicsRes] =
                            await Promise.allSettled([
                                fetch('/api/ai/sip/',                        { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                                fetch('/api/sessions/stats/overall/',         { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                                fetch('/api/sessions/stats/weekly/',          { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                                fetch('/api/sessions/recent/?limit=5',        { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                                fetch('/api/ai/recommendations/?n=1',         { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                                fetch('/api/core/topics/?page_size=200',      { credentials: 'include' }).then(r => r.ok ? r.json() : null),
                            ]);

                        if (!mounted) return;

                        /* SIP */
                        const sipData = sipRes.status === 'fulfilled' ? sipRes.value : null;
                        setSip(sipData);

                        /* Overall stats */
                        const overall = overallRes.status === 'fulfilled' ? overallRes.value : null;
                        setOverallStats(overall);

                        /* Weekly trend */
                        const weekly = weeklyRes.status === 'fulfilled' ? weeklyRes.value : null;
                        setWeeklyTrend(weekly?.trend || []);

                        /* Recent sessions */
                        const recent = recentRes.status === 'fulfilled' ? recentRes.value : null;
                        setRecentSessions(recent?.sessions || []);

                        /* Recommendation â€” take first */
                        const recData = recRes.status === 'fulfilled' ? recRes.value : null;
                        setRecommendation(recData?.recommendations?.[0] || null);

                        /* Topics â†’ build subject map + subject bar chart */
                        const topicsData = topicsRes.status === 'fulfilled' ? topicsRes.value : null;
                        const topicList = topicsData?.results || topicsData || [];

                        /* Build topicIdâ†’subjectName map */
                        const tsMap = {};
                        topicList.forEach(t => {
                            const subName = t.subject?.name || t.subject_name || '?';
                            tsMap[String(t.id)] = subName;
                        });
                        setTopicSubjectMap(tsMap);

                        /* Build per-subject average mastery from SIP mastery_map */
                        if (sipData?.mastery_map) {
                            const subjAcc = {}; // { subjectName: [elo, ...] }
                            Object.entries(sipData.mastery_map).forEach(([tid, elo]) => {
                                const sub = tsMap[String(tid)];
                                if (!sub || sub === '?') return;
                                if (!subjAcc[sub]) subjAcc[sub] = [];
                                subjAcc[sub].push(elo);
                            });
                            const subjData = Object.entries(subjAcc).map(([name, elos]) => ({
                                name,
                                pct: Math.round(elos.reduce((a,b) => a+b, 0) / elos.length / 2000 * 100)
                            })).sort((a,b) => b.pct - a.pct).slice(0, 6);

                            setSubjectData(subjData.length > 0 ? subjData : []);
                        }

                    } catch (err) {
                        console.error('Dashboard load error:', err);
                    } finally {
                        if (mounted) setLoading(false);
                    }
                };

                loadDashboard();
                return () => { mounted = false; };
            }, []);

            /* Re-run lucide after every render */
            useEffect(() => { lucide.createIcons(); });

            const streak = sip?.daily_streak ?? 0;

            return (
                <div className="db-layout">
                    <Sidebar user={user} onLogout={handleLogout} />

                    <main className="db-main">
                        {/* â”€â”€ Header â”€â”€ */}
                        <div className="db-header">
                            <div>
                                <h1 className="db-welcome-title">
                                    Welcome back, {user?.username || 'Student'}!
                                </h1>
                                <p className="db-welcome-sub">Here's your learning overview</p>
                            </div>
                            <div className="db-streak-badge">
                                <span>ðŸ“…</span>
                                <span>{streak} Day Streak!</span>
                                <span>ðŸ”¥</span>
                            </div>
                        </div>

                        {/* â”€â”€ KPI Cards â”€â”€ */}
                        <KpiCards sip={sip} overallStats={overallStats} sessionCount={recentSessions.length} />

                        {/* â”€â”€ Charts â”€â”€ */}
                        <div className="db-charts-grid">
                            <PerformanceChart weeklyTrend={weeklyTrend} />
                            <SubjectChart subjectData={subjectData} />
                        </div>

                        {/* â”€â”€ Bottom row â”€â”€ */}
                        <div className="db-bottom-grid">
                            <RecentSessions
                                sessions={recentSessions}
                                topicSubjectMap={topicSubjectMap}
                                masteryMap={sip?.mastery_map || {}}
                            />
                            <RecommendedCard rec={recommendation} />
                        </div>
                    </main>
                </div>
            );
        };

        /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
           App Root
        â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        const App = () => <Dashboard />;
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        {% endverbatim %}
    </script>
</body>
