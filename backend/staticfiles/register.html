<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Autonomous Tutoring</title>
    <meta name="description" content="Create an account to access the autonomous tutoring framework">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <!-- Floating Particles Background -->
    <canvas id="particles-bg"></canvas>
    
    <!-- Ambient Glow Effects -->
    <div class="ambient-layer">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <!-- Register Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join the future of autonomous learning</p>
            </div>

            <!-- Register Form -->
            <form class="auth-form" id="registerForm">
                <!-- Username Field -->
                <div class="input-group">
                    <input 
                        type="text" 
                        id="username"
                        name="username"
                        class="auth-input" 
                        required
                        autocomplete="username"
                        minlength="3"
                    >
                    <label for="username" class="floating-label">Username</label>
                    <div class="input-glow"></div>
                </div>

                <!-- Email Field -->
                <div class="input-group">
                    <input 
                        type="email" 
                        id="email"
                        name="email"
                        class="auth-input" 
                        required
                        autocomplete="email"
                    >
                    <label for="email" class="floating-label">Email</label>
                    <div class="input-glow"></div>
                </div>

                <!-- Password Field -->
                <div class="input-group">
                    <input 
                        type="password" 
                        id="password"
                        name="password"
                        class="auth-input" 
                        required
                        autocomplete="new-password"
                        minlength="8"
                    >
                    <label for="password" class="floating-label">Password</label>
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                    <div class="input-glow"></div>
                    
                    <!-- Password Strength Indicator -->
                    <div class="password-strength hidden" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Weak</span>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="input-group">
                    <input 
                        type="password" 
                        id="confirmPassword"
                        name="confirmPassword"
                        class="auth-input" 
                        required
                        autocomplete="new-password"
                    >
                    <label for="confirmPassword" class="floating-label">Confirm Password</label>
                    <button type="button" class="password-toggle" aria-label="Toggle password visibility">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                    <div class="input-glow"></div>
                </div>

                <!-- Error Message -->
                <div class="error-message hidden" id="errorMessage">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="errorText">Please fix the errors above</span>
                </div>

                <!-- Register Button -->
                <button type="submit" class="auth-button" id="registerButton">
                    <span class="button-text">Create Account</span>
                    <span class="button-loader hidden">
                        <span class="loader-dot"></span>
                        <span class="loader-dot"></span>
                        <span class="loader-dot"></span>
                    </span>
                    <div class="button-glow"></div>
                </button>

                <!-- Login Link -->
                <div class="auth-link">
                    <p>Already have an account? <a href="login.html" class="link-highlight">Login here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
