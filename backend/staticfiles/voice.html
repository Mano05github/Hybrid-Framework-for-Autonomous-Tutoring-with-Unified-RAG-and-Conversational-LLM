<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant - Vaathiyar</title>
    <meta name="description" content="AI-powered voice assistant for personalized learning">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/shared-learning.css">
    <link rel="stylesheet" href="/static/css/voice.css">
    
    <!-- Auth Guard (must load first) -->
    <script src="/static/js/auth-guard.js"></script>
    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/websocket-client.js"></script>
    <script>
        // Check authentication before page loads
        (async () => {
            const isAuthenticated = await AuthGuard.checkAuth();
            if (!isAuthenticated) return;
        })();
    </script>
</head>
<body>
    <!-- Floating Particles Background -->
    <canvas id="particles-bg"></canvas>
    
    <!-- Ambient Glow Effects -->
    <div class="ambient-layer">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="top-nav">
        <span class="brand">Vaathiyar</span>
        <div class="nav-actions">
            <a href="dashboard.html">Dashboard</a>
        </div>
    </nav>

    <!-- Main Page Container -->
    <div class="page-container">
        
        <!-- Voice Assistant Interface -->
        <div class="voice-assistant-container">
            
            <!-- Waveform Visualization -->
            <div class="waveform-section">
                <canvas id="waveform-canvas"></canvas>
                <p class="listening-text">Say "Vanakkam Vaathiyarey" to activate</p>
            </div>

            <!-- Chat History -->
            <div class="chat-history" id="chatHistory">
                <!-- Welcome message -->
                <div class="message ai-message fade-in">
                    <div class="message-avatar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 16v-4"></path>
                            <path d="M12 8h.01"></path>
                        </svg>
                    </div>
                    <div class="message-content">
                        <p class="message-sender">Vaathiyar</p>
                        <p class="message-text">Hello! I'm Vaathiyar, your AI learning assistant. How can I help you today?</p>
                        <span class="message-time">Just now</span>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="quick-actions">
                <button class="quick-action-btn" data-action="explain">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Explain this
                </button>
                <button class="quick-action-btn" data-action="example">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <polyline points="16 18 22 12 16 6"></polyline>
                        <polyline points="8 6 2 12 8 18"></polyline>
                    </svg>
                    Give example
                </button>
                <button class="quick-action-btn" data-action="quiz">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Quiz me
                </button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="typing-indicator hidden" id="typingIndicator">
                    <span></span>
                    <span></span>
                    <span></span>
                    <p>Vaathiyar is typing...</p>
                </div>
                
                <div class="input-container">
                    <input 
                        type="text" 
                        class="message-input" 
                        id="messageInput"
                        placeholder="Type your message here..."
                        autocomplete="off"
                    >
                    <button class="voice-toggle-btn" id="voiceToggleBtn" title="Toggle voice input">
                        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button class="send-btn" id="sendBtn" title="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script src="/static/js/api-client.js"></script>
    <script src="/static/js/websocket-client.js"></script>
    <script src="/static/js/shared-utils.js"></script>
    <script src="/static/js/voice.js"></script>
</body>
</html>
